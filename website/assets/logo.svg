<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" fill="none">
  <defs>
    <!-- Gradiente Diadema -->
    <linearGradient id="shHeadbandGrad" x1="32" y1="24" x2="76" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Gradiente Auriculares -->
    <linearGradient id="shCupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="shGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ondas Inalámbricas Superiores (Broadcast) -->
  <path d="M 41,11 C 49,7 59,7 67,11" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 45,17 C 50,14 58,14 63,17" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Diadema Principal -->
  <path d="M 32,56 C 32,36 42,24 54,24 C 66,24 76,36 76,56" stroke="url(#shHeadbandGrad)" stroke-width="6" stroke-linecap="round" filter="url(#shGlow)" />

  <!-- Diadema Acolchada Superior -->
  <path d="M 44,27 C 47,25 51,24 54,24 C 57,24 61,25 64,27" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

  <!-- Auricular Izquierdo -->
  <rect x="23" y="52" width="15" height="24" rx="4" fill="url(#shCupGrad)" stroke="#06B6D4" stroke-width="2" />
  <!-- Almohadilla Izquierda -->
  <path d="M 33,55 C 34.5,55 35.5,56 35.5,58 L 35.5,70 C 35.5,72 34.5,73 33,73 Z" fill="#38BDF8" />

  <!-- Auricular Derecho -->
  <rect x="70" y="52" width="15" height="24" rx="4" fill="url(#shCupGrad)" stroke="#818CF8" stroke-width="2" />
  <!-- Almohadilla Derecha -->
  <path d="M 75,55 C 73.5,55 72.5,56 72.5,58 L 72.5,70 C 72.5,72 73.5,73 75,73 Z" fill="#38BDF8" />

  <!-- Barras Sonoras Ecualizador (Share Audio) -->
  <!-- Barra Central -->
  <path d="M 54,48 L 54,74" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <!-- Barras Intermedias -->
  <path d="M 48,54 L 48,68" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 60,54 L 60,68" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" />
  <!-- Barras Exteriores -->
  <path d="M 43,59 L 43,63" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
  <path d="M 65,59 L 65,63" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
</svg>
